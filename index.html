<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Social AIO Blog – Hướng dẫn &amp; thông báo</title>
        <meta
            name="description"
            content="Blog Social AIO: hướng dẫn dùng các công cụ tải dữ liệu, tự động hoá và tiện ích cho Facebook, Instagram, TikTok, Threads, cùng thông báo cập nhật."
        />
        <link rel="canonical" href="https://blog.fbaio.org/" />
        <meta property="og:site_name" content="Social AIO Blog" />
        <meta property="og:title" content="Social AIO Blog" />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://blog.fbaio.org/" />
        <link rel="icon" type="image/png" href="./logo.png" />

        <script>
            // Link /post/<id> chưa có trang tĩnh (SPA fallback) -> chuyển về route hash của SPA
            (function () {
                var m = location.pathname.match(/^\/post\/(\d+)\/?$/);
                if (m) location.replace('/#post/' + m[1]);
            })();
        </script>
        <script>
            (function () {
                var savedTheme = localStorage.getItem('theme');
                if (
                    savedTheme === 'dark' ||
                    (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)
                ) {
                    document.documentElement.classList.add('dark');
                }
                if ('scrollRestoration' in history) {
                    history.scrollRestoration = 'manual';
                }
            })();
        </script>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css"
        />

        <script src="https://unpkg.com/preact@10.19.6/dist/preact.umd.js"></script>
        <script src="https://unpkg.com/preact@10.19.6/hooks/dist/hooks.umd.js"></script>
        <script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                darkMode: 'class',
                theme: {
                    extend: {
                        colors: {
                            ember: '#db5c44',
                            lagoon: '#0f766e',
                            ink: '#172033'
                        }
                    }
                }
            };
        </script>

        <link href="./style.css" rel="stylesheet" />
    </head>

    <body>
        <div id="root"></div>
        <noscript><p><a href="/post/">Social AIO Blog – xem danh sách bài viết</a></p></noscript>

        <script type="module" src="./src/main.js"></script>
    </body>
</html>
